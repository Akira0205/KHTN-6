<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHTN 6 - Hệ Thống Tính Điểm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .app-container {
            width: 98vw;
            height: 94vh;
            max-width: 1200px;
            background: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .split-view {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .question-column {
            flex: 1.3;
            padding: 3rem;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid #e2e8f0;
        }

        .options-column {
            flex: 1;
            padding: 2.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .opt-card {
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 12px;
            border: 2px solid #f1f5f9;
            border-radius: 12px;
            text-align: left;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
            align-items: center;
            color: #475569;
        }

        .opt-card:hover:not(:disabled) {
            border-color: #3b82f6;
            background-color: #eff6ff;
            transform: translateX(6px);
        }

        .is-correct {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #166534 !important;
        }

        .is-wrong {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }

        .score-badge {
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: bold;
        }

        /* Rank Colors */
        .rank-gioi { color: #16a34a; }
        .rank-kha { color: #ca8a04; }
        .rank-tb { color: #dc2626; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Top Bar -->
    <div class="h-16 px-8 border-b flex items-center justify-between">
        <div class="flex items-center gap-4">
            <span class="text-blue-600 font-black text-2xl">KHTN 6</span>
            <div class="flex gap-2">
                <span class="score-badge bg-green-100 text-green-700">Đúng: <span id="correct-count">0</span></span>
                <span class="score-badge bg-red-100 text-red-700">Sai: <span id="wrong-count">0</span></span>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <div class="text-right mr-2">
                <div class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Tiến độ</div>
                <div id="prog-text" class="text-sm font-bold text-slate-700">1 / 55</div>
            </div>
            <div class="w-32 h-2.5 bg-slate-100 rounded-full overflow-hidden">
                <div id="prog-bar" class="bg-blue-500 h-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="quiz-screen" class="split-view">
        <div class="question-column">
            <div id="topic-label" class="inline-block bg-blue-600 text-white text-[10px] font-bold px-2 py-1 rounded mb-4 uppercase tracking-wider w-fit">BÀI HỌC</div>
            <h2 id="question-display" class="text-3xl font-bold text-slate-800 leading-tight">
                Đang chuẩn bị câu hỏi...
            </h2>
        </div>
        <div class="options-column">
            <div id="options-list"></div>
        </div>
    </div>

    <!-- Summary Screen (Hidden) -->
    <div id="summary-screen" class="hidden flex-1 flex flex-col items-center justify-center p-8 text-center bg-white rounded-20">
        <div id="rank-icon" class="text-7xl mb-4">🏆</div>
        <h2 class="text-4xl font-black text-slate-800 mb-2">Kết Quả Cuối Cùng</h2>
        <p id="rank-text" class="text-xl font-bold mb-8 uppercase tracking-widest">Hạng: GIỎI</p>
        
        <div class="grid grid-cols-3 gap-8 mb-10 w-full max-w-lg">
            <div class="bg-slate-50 p-4 rounded-xl">
                <p class="text-slate-400 text-xs font-bold uppercase">Tổng điểm</p>
                <p class="text-3xl font-black text-blue-600"><span id="final-correct">0</span>/55</p>
            </div>
            <div class="bg-slate-50 p-4 rounded-xl">
                <p class="text-slate-400 text-xs font-bold uppercase">Chính xác</p>
                <p id="final-percent" class="text-3xl font-black text-green-600">0%</p>
            </div>
            <div class="bg-slate-50 p-4 rounded-xl">
                <p class="text-slate-400 text-xs font-bold uppercase">Số câu sai</p>
                <p id="final-wrong" class="text-3xl font-black text-red-500">0</p>
            </div>
        </div>

        <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white px-12 py-4 rounded-2xl font-bold text-lg shadow-lg shadow-blue-200 transition-all active:scale-95">
            THỬ SỨC LẠI
        </button>
    </div>

    <!-- Footer Nav -->
    <div class="h-20 px-8 border-t bg-slate-50 flex items-center justify-between rounded-b-20">
        <button id="prev-btn" onclick="handlePrev()" class="text-slate-400 font-bold hover:text-slate-800 disabled:opacity-0 transition-all flex items-center gap-2">
            <span>&larr;</span> QUAY LẠI
        </button>
        <div class="text-slate-300 font-medium italic text-sm" id="feedback-msg">Hãy chọn một đáp án đúng nhất</div>
        <button id="next-btn" onclick="handleNext()" class="bg-blue-600 text-white px-10 py-3 rounded-xl font-bold opacity-0 pointer-events-none transition-all shadow-md">
            TIẾP THEO &rarr;
        </button>
    </div>
</div>

<script>
    // Dữ liệu câu hỏi từ file đính kèm
    const questions = [
        { q: "Thành phần chiếm tỉ lệ lớn nhất trong không khí là:", a: ["Oxygen (O2).", "Nitrogen (N2).", "Carbon dioxide (CO2).", "Hơi nước."], c: 1, t: "BÀI 7: OXYGEN KHÔNG KHÍ" },
        { q: "Oxygen cần thiết cho quá trình nào của con người và động vật?", a: ["Quang hợp.", "Hô hấp.", "Tiêu hoá.", "Bài tiết."], c: 1, t: "BÀI 7: OXYGEN KHÔNG KHÍ" },
        { q: "Khi úp một cốc thuỷ tinh lên ngọn nến đang cháy, sau một thời gian ngọn nến tắt là vì:", a: ["Ngọn nến bị gió thổi tắt.", "Oxygen trong cốc đã được dùng hết cho sự cháy.", "Nitrogen trong không khí làm nến tắt.", "Không khí trong cốc quá lạnh."], c: 1, t: "BÀI 7: OXYGEN KHÔNG KHÍ" },
        { q: "Trong các biện pháp sau, biện pháp nào góp phần làm giảm ô nhiễm không khí?", a: ["Đốt nhiều rác thải sinh hoạt.", "Sử dụng bếp than trong phòng kín.", "Trồng nhiều cây xanh.", "Sử dụng xe máy cũ, nhiều khói."], c: 2, t: "BÀI 7: OXYGEN KHÔNG KHÍ" },
        { q: "Khí oxygen chiếm khoảng bao nhiêu phần trăm thể tích không khí?", a: ["78%.", "21%.", "28%.", "10%."], c: 1, t: "BÀI 7: OXYGEN KHÔNG KHÍ" },
        { q: "Bác sĩ cho bệnh nhân thở oxygen dựa vào tính chất nào của oxygen?", a: ["Duy trì sự sống.", "Ít tan trong nước.", "Không màu không mùi.", "Duy trì sự cháy."], c: 0, t: "BÀI 7: OXYGEN KHÔNG KHÍ" },
        { q: "Cần sử dụng các thiết bị bảo hộ khi tiếp xúc với chất nào sau đây?", a: ["Nước uống.", "Nước muối.", "Các hóa chất độc hại.", "Dầu ăn."], c: 2, t: "AN TOÀN PHÒNG THÍ NGHIỆM" },
        { q: "Khi thấy người bị ngộ độc khí CO, chúng ta cần làm gì đầu tiên?", a: ["Cho uống nước.", "Đưa nạn nhân đến nơi thoáng khí.", "Đắp chăn ấm.", "Yêu cầu nằm yên."], c: 1, b: "BÀI 7: OXYGEN KHÔNG KHÍ" },
        { q: "Vật liệu nào sau đây được dùng để xây dựng nhà ở?", a: ["Gỗ.", "Xăng.", "Than đá.", "Dầu hỏa."], c: 0, t: "BÀI 8: VẬT LIỆU" },
        { q: "Chất nào sau đây là nhiên liệu?", a: ["Cát.", "Nhựa.", "Xăng.", "Sắt."], c: 2, t: "BÀI 8: NHIÊN LIỆU" },
        { q: "Nguyên liệu nào sau đây dùng để sản xuất giấy?", a: ["Quặng sắt.", "Gỗ.", "Than đá.", "Nhôm."], c: 1, t: "BÀI 8: NGUYÊN LIỆU" },
        { q: "Vật liệu nào sau đây được dùng để làm vỏ máy bay?", a: ["Đồng.", "Nhôm.", "Sắt.", "Vàng."], c: 1, t: "BÀI 8: VẬT LIỆU" },
        { q: "Vì sao xăng được dùng làm nhiên liệu cho xe máy?", a: ["Dễ bay hơi.", "Cháy và tỏa nhiều nhiệt.", "Mùi dễ chịu.", "Ở trạng thái lỏng."], c: 1, t: "BÀI 8: NHIÊN LIỆU" },
        { q: "Biện pháp nào sử dụng nhiên liệu hợp lí và bảo vệ môi trường?", a: ["Đốt rác.", "Dùng bếp than kín.", "Dùng nilon.", "Dùng năng lượng mặt trời."], c: 3, t: "BÀI 8: NHIÊN LIỆU" },
        { q: "Vật liệu dẫn điện tốt thường dùng làm lõi dây điện?", a: ["Gốm.", "Thủy tinh.", "Đồng.", "Gỗ."], c: 2, t: "BÀI 8: VẬT LIỆU" },
        { q: "Nhiên liệu nào sau đây KHÔNG được chế biến từ dầu mỏ?", a: ["Khí hóa lỏng.", "Xăng.", "Dầu diesel.", "Than."], c: 3, t: "BÀI 8: NHIÊN LIỆU" },
        { q: "Thế nào được gọi là an ninh năng lượng?", a: ["Đủ dùng, sạch, rẻ.", "Đủ điện dùng.", "Năng lượng nhiều dạng.", "Cung cấp đủ."], c: 0, t: "BÀI 8: NHIÊN LIỆU" },
        { q: "Tính chất nào KHÔNG phải là tính chất chung của kim loại?", a: ["Dẻo.", "Cứng.", "Dẫn nhiệt.", "Dẫn điện."], c: 1, t: "BÀI 8: VẬT LIỆU" },
        { q: "Để sử dụng gas tiết kiệm, cần điều chỉnh lượng gas như thế nào?", a: ["Lửa thật nhỏ.", "Lửa thật lớn.", "Không đổi.", "Vừa với đáy nồi."], c: 3, t: "BÀI 8: NHIÊN LIỆU" },
        { q: "Chất nào sau đây được gọi là chất tinh khiết?", a: ["Nước biển.", "Nước cất.", "Nước cam.", "Nước khoáng."], c: 1, t: "BÀI 10: HỖN HỢP" },
        { q: "Dung dịch là:", a: ["Chất không tan.", "Hỗn hợp đồng nhất chất tan và dung môi.", "Chất 1 thành phần.", "Hỗn hợp không đồng nhất."], c: 1, t: "BÀI 10: HỖN HỢP" },
        { q: "Muối ăn hòa vào nước tạo dung dịch vì:", a: ["Đồng nhất.", "Muối lắng.", "Muối bay hơi.", "Nước tinh khiết."], c: 0, t: "BÀI 10: HỖN HỢP" },
        { q: "Trong các hỗn hợp sau, hỗn hợp nào là dung dịch?", a: ["Cát+nước.", "Dầu+nước.", "Đường+nước.", "Gạo+sỏi."], c: 2, t: "BÀI 10: HỖN HỢP" },
        { q: "Bột sắn dây vào nước và khuấy đều thu được:", a: ["Dung dịch.", "Nhũ tương.", "Dung môi.", "Huyền phù."], c: 3, t: "BÀI 10: HỖN HỢP" },
        { q: "Trường hợp nào dưới đây KHÔNG phải là hỗn hợp?", a: ["Muối ăn (NaCl).", "Bột canh.", "Nước khoáng.", "Nước muối sinh lí."], c: 0, t: "BÀI 10: HỖN HỢP" },
        { q: "Dầu ăn vào giấm khuấy đều thu được:", a: ["Nhũ tương.", "Huyền phù.", "Dung dịch.", "Dung môi."], c: 0, t: "BÀI 10: HỖN HỢP" },
        { q: "Hòa 2 thìa muối vào nước khuấy đều thu được:", a: ["Huyền phù.", "Nhũ tương.", "Dung dịch muối.", "Chất tinh khiết."], c: 2, t: "BÀI 10: HỖN HỢP" },
        { q: "Thành phần chính của đá vôi là:", a: ["Sắt.", "Đồng.", "Sodium carbonate.", "Calcium carbonate."], c: 3, t: "BÀI 10: HỖN HỢP" },
        { q: "Đơn vị đo chiều dài là:", a: ["Kg.", "Mét (m).", "Giây.", "Lít."], c: 1, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "Dụng cụ dùng để đo khối lượng là:", a: ["Thước.", "Đồng hồ.", "Cân.", "Nhiệt kế."], c: 2, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "Đơn vị đo thời gian chính thức là:", a: ["Ngày.", "Giờ.", "Giây (s).", "Tháng."], c: 2, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "Dụng cụ thích hợp đo chiều dài quyển sách?", a: ["Thước kẻ.", "Cân.", "Bấm giây.", "Cốc."], c: 0, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "Để kết quả đo chính xác, đặt thước thế nào?", a: ["Cách vật.", "Vạch 0 trùng đầu vật.", "Nghiêng.", "Lệch."], c: 1, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "Kết quả đo bút là 12,5cm. Con số này là:", a: ["Đơn vị.", "Dụng cụ.", "Kết quả đo.", "GHĐ."], c: 2, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "Đo thời gian chạy 100m dùng:", a: ["Đồng hồ bàn.", "Đồng hồ treo.", "Đồng hồ bấm giây.", "Lịch."], c: 2, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "Túi gạo 2kg. Con số 2 cho biết:", a: ["Đơn vị.", "Khối lượng.", "Dụng cụ.", "Cách đo."], c: 1, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "Thứ tự bước đo cân đồng hồ?", a: ["(1)-(4)-(3)-(2).", "(1)-(2)-(3)-(4).", "(2)-(1)-(3)-(4).", "(2)-(1)-(4)-(3)."], c: 0, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "Đơn vị đo chiều dài?", a: ["Kg.", "Lít.", "Giờ.", "Mét."], c: 3, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "Thước 0-10cm có 10 vạch nhỏ/cm. GHĐ và ĐCNN là:", a: ["10cm, 10mm.", "10cm, 0.1mm.", "10cm, 100mm.", "10cm, 1mm."], c: 3, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "Đổi đơn vị nào đúng?", a: ["1 yến = 100kg.", "1 tấn = 10 tạ.", "1kg = 10g.", "1 tấn = 100kg."], c: 1, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "Đơn vị đo khối lượng?", a: ["Tuần.", "Tấn.", "Giây.", "Ngày."], c: 1, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "GHĐ của thước là:", a: ["Giữa 2 vạch.", "Độ dài nhỏ nhất.", "Độ dài lớn nhất ghi trên thước.", "Vạch chia."], c: 2, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "Thứ tự bước đo độ dài?", a: ["(2)-(1)-(3)-(4).", "(1)-(2)-(4)-(3).", "(1)-(2)-(3)-(4).", "(2)-(1)-(4)-(3)."], c: 2, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "Đo độ dài vật nên dùng:", a: ["Bàn chân.", "Thước.", "Gang tay.", "Dây."], c: 1, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "Dụng cụ đo nhiệt độ là:", a: ["Thước.", "Cân.", "Nhiệt kế.", "Đồng hồ."], c: 2, t: "BÀI 4: ĐO NHIỆT ĐỘ" },
        { q: "Đo nhiệt độ cơ thể bằng thủy ngân cần:", a: ["Cầm chặt.", "Đọc ngay.", "Bầu tiếp xúc và đợi.", "Lắc mạnh khi đo."], c: 2, t: "BÀI 4: ĐO NHIỆT ĐỘ" },
        { q: "Đo nhiệt độ nước nóng an toàn cần:", a: ["Chạm đáy.", "Sát thành.", "Bầu không chạm đáy/thành.", "Cầm tay."], c: 2, t: "BÀI 4: ĐO NHIỆT ĐỘ" },
        { q: "Nhiệt kế 0-100 đo người không hợp vì:", a: ["Dài.", "GHĐ không hợp lý.", "Không chuẩn.", "Khó dùng."], c: 1, t: "BÀI 4: ĐO NHIỆT ĐỘ" },
        { q: "Nhiệt kế y tế thủy ngân dựa trên:", a: ["Nở chất rắn.", "Nở các chất.", "Nở chất lỏng.", "Nở chất khí."], c: 2, t: "BÀI 4: ĐO NHIỆT ĐỘ" },
        { q: "Dụng cụ đo nhiệt độ?", a: ["Đồng hồ.", "Cốc.", "Cân.", "Nhiệt kế."], c: 3, t: "BÀI 4: ĐO NHIỆT ĐỘ" },
        { q: "Đo nhiệt độ sôi của nước?", a: ["Đổi màu.", "Rượu.", "Y tế.", "Thủy ngân."], c: 3, t: "BÀI 4: ĐO NHIỆT ĐỘ" },
        { q: "Đơn vị đo nhiệt độ?", a: ["Kg.", "Cm.", "°C.", "L."], c: 2, t: "BÀI 4: ĐO NHIỆT ĐỘ" },
        { q: "Lực tiếp xúc xuất hiện khi vật gây lực ... vật chịu lực.", a: ["Cách xa.", "Có tiếp xúc.", "Nằm gần.", "Không tiếp xúc."], c: 1, t: "BÀI 27: LỰC" },
        { q: "Lực không tiếp xúc xuất hiện khi vật gây lực ... vật chịu lực.", a: ["Không tiếp xúc.", "Tiếp xúc.", "Tì sát.", "Ép lên."], c: 0, t: "BÀI 27: LỰC" },
        { q: "Trường hợp nào là lực tiếp xúc?", a: ["Táo rơi.", "Nam châm hút sắt.", "Gió thổi buồm.", "Trái đất hút Trăng."], c: 2, t: "BÀI 27: LỰC" }
    ];

    let current = 0;
    let scoreCorrect = 0;
    let scoreWrong = 0;
    let userChoices = new Array(questions.length).fill(null);

    const qDisplay = document.getElementById('question-display');
    const optionsList = document.getElementById('options-list');
    const progText = document.getElementById('prog-text');
    const progBar = document.getElementById('prog-bar');
    const topicLabel = document.getElementById('topic-label');
    const nextBtn = document.getElementById('next-btn');
    const prevBtn = document.getElementById('prev-btn');
    const correctCountDisplay = document.getElementById('correct-count');
    const wrongCountDisplay = document.getElementById('wrong-count');

    function initQuiz() {
        renderQuestion();
    }

    function renderQuestion() {
        const item = questions[current];
        
        // Progress & Headers
        progText.textContent = `${current + 1} / ${questions.length}`;
        progBar.style.width = `${((current + 1) / questions.length) * 100}%`;
        topicLabel.textContent = item.t;
        qDisplay.textContent = item.q;
        
        // Score Display
        correctCountDisplay.textContent = scoreCorrect;
        wrongCountDisplay.textContent = scoreWrong;

        // Options
        optionsList.innerHTML = '';
        item.a.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-card';
            btn.innerHTML = `
                <span class="w-7 h-7 flex items-center justify-center bg-white border border-slate-200 rounded-md mr-4 text-xs font-bold text-slate-400">${String.fromCharCode(65+idx)}</span>
                <span>${opt}</span>
            `;

            if (userChoices[current] !== null) {
                if (idx === item.c) btn.classList.add('is-correct');
                else if (idx === userChoices[current]) btn.classList.add('is-wrong');
                btn.disabled = true;
            } else {
                btn.onclick = () => handleSelect(idx);
            }
            optionsList.appendChild(btn);
        });

        // Navigation state
        prevBtn.disabled = current === 0;
        if (userChoices[current] !== null) {
            nextBtn.style.opacity = '1';
            nextBtn.style.pointerEvents = 'auto';
            nextBtn.textContent = current === questions.length - 1 ? "XEM KẾT QUẢ" : "TIẾP THEO \u2192";
        } else {
            nextBtn.style.opacity = '0';
            nextBtn.style.pointerEvents = 'none';
        }
    }

            document.getElementById('feedback-msg').className = "text-green-500 font-bold italic text-sm";
        } else {
            scoreWrong++;
            document.getElementById('feedback-msg').textContent = "Rất tiếc, chưa đúng rồi.";
            document.getElementById('feedback-msg').className = "text-red-500 font-bold italic text-sm";
        }
        renderQuestion();
    }

    function handleNext() {
        if (current < questions.length - 1) {
            current++;
            document.getElementById('feedback-msg').textContent = "Hãy chọn một đáp án đúng nhất";
            document.getElementById('feedback-msg').className = "text-slate-300 font-medium italic text-sm";
            renderQuestion();
        } else {
            showSummary();
        }
    }

    function handlePrev() {
        if (current > 0) {
            current--;
            renderQuestion();
        }
    }
