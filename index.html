    <style>
        /* Sử dụng bảng mã font an toàn nhất cho tiếng Việt trên mọi trình duyệt */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f8fafc;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .main-card {
            width: 98vw;
            height: 92vh;
            max-width: 1200px;
            background: #ffffff;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
        }

        .split-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .left-side {
            flex: 1.2;
            padding: 3rem;
            background: #fdfdfd;
            border-right: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-side {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .opt-button {
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 12px;
            border: 2px solid #f1f5f9;
            border-radius: 12px;
            text-align: left;
            font-weight: 500;
            font-size: 1.05rem;
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            color: #334155;
        }

        .opt-button:hover:not(:disabled) {
            border-color: #3b82f6;
            background-color: #eff6ff;
            transform: translateX(4px);
        }

        .ans-correct {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #166534 !important;
        }

        .ans-wrong {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }

        .chapter-tag {
            display: inline-block;
            background: #3b82f6;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        /* Fix scrollbar */
        .right-side::-webkit-scrollbar { width: 5px; }
        .right-side::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

</head>

        document.getElementById('q-text').textContent = item.q;
        document.getElementById('badge').textContent = item.b;
        document.getElementById('progress-text').textContent = (current + 1) + " / " + data.length;
        document.getElementById('progress-bar').style.width = ((current + 1) / data.length * 100) + "%";
        
        const box = document.getElementById('options-box');
        box.innerHTML = '';
        item.a.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-button';
            btn.innerHTML = `<span style="width:30px; display:inline-block; font-weight:bold; color:#94a3b8">${String.fromCharCode(65+idx)}.</span> ${opt}`;
            
            if (userAns[current] !== null) {
                if (idx === item.c) btn.classList.add('ans-correct');
                else if (idx === userAns[current]) btn.classList.add('ans-wrong');
                btn.disabled = true;
            } else {
                btn.onclick = () => select(idx);
            }
            box.appendChild(btn);
        });

        document.getElementById('prev-q').disabled = (current === 0);
        const next = document.getElementById('next-q');
        if (userAns[current] !== null) {
            next.style.opacity = '1';
            next.style.pointerEvents = 'auto';
            next.textContent = (current === data.length - 1) ? "XEM KẾT QUẢ" : "TIẾP THEO \u2192";
        } else {
            next.style.opacity = '0';
            next.style.pointerEvents = 'none';
        }
    }

    function select(i) {
        userAns[current] = i;
        if (i === data[current].c) score++;
        show();
    }

    function next() {
        if (current < data.length - 1) {
            current++;
            show();
        } else {
            document.getElementById('quiz-area').classList.add('hidden');
            document.getElementById('final-box').classList.remove('hidden');
            document.getElementById('final-score').textContent = score + " / " + data.length;
        }
    }

    function prev() {
        if (current > 0) {
            current--;
            show();
        }
    }

    show();
</script>
</body>
</html>
