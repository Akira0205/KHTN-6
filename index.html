<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHTN 6 - Ôn Tập Ngẫu Nhiên</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .quiz-container { max-width: 1000px; width: 95%; height: 90vh; background: white; border-radius: 1.5rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; overflow: hidden; }
        .option-card { transition: all 0.2s; border: 2px solid #f3f4f6; cursor: pointer; }
        .option-card:hover:not(.disabled) { border-color: #3b82f6; background-color: #eff6ff; transform: translateX(4px); }
        .correct { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #166534 !important; }
        .wrong { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }
        .step-item { background: #f9fafb; border-left: 4px solid #3b82f6; padding: 0.6rem; border-radius: 0.375rem; font-size: 0.85rem; margin-bottom: 0.4rem; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="quiz-container">
    <!-- Header -->
    <div class="p-5 border-b flex justify-between items-center bg-white z-10">
        <div>
            <h1 class="text-lg font-black text-blue-700 uppercase tracking-tight">Ôn Tập KHTN 6 (Xáo Trộn Câu Hỏi)</h1>
            <div class="flex gap-4 mt-1">
                <span class="text-[10px] font-bold text-green-600 bg-green-50 px-2 py-0.5 rounded">ĐÚNG: <span id="correct-count">0</span></span>
                <span class="text-[10px] font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded">SAI: <span id="wrong-count">0</span></span>
            </div>
        </div>
        <div class="text-right">
            <p id="progress-text" class="text-xs font-bold text-slate-400 tracking-widest">1 / 56</p>
            <div class="w-32 h-1.5 bg-slate-100 rounded-full mt-1">
                <div id="progress-bar" class="h-full bg-blue-500 transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-view" class="flex-1 flex flex-col md:flex-row overflow-hidden">
        <!-- Question Side -->
        <div class="flex-1 p-6 md:p-10 overflow-y-auto bg-slate-50 border-r">
            <span id="topic-label" class="inline-block px-2 py-1 bg-blue-100 text-blue-700 text-[10px] font-bold rounded mb-4 uppercase">BÀI HỌC</span>
            <h2 id="question-text" class="text-xl md:text-2xl font-bold text-slate-800 leading-tight">Đang tải câu hỏi...</h2>
            
            <div id="steps-container" class="mt-6 hidden">
                <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">Thông tin các bước hành động:</p>
                <div id="steps-list"></div>
            </div>
        </div>

        <!-- Options Side -->
        <div class="w-full md:max-w-md p-6 md:p-10 overflow-y-auto bg-white">
            <div id="options-list" class="space-y-3"></div>
        </div>
    </div>

    <!-- Result View -->
    <div id="result-view" class="hidden flex-1 flex flex-col items-center justify-center p-12 text-center bg-white">
        <div class="text-6xl mb-4">🏆</div>
        <h2 class="text-3xl font-black text-slate-800 mb-2 uppercase">Kết Quả Ôn Tập</h2>
        <p id="rank-display" class="text-lg font-bold text-blue-600 mb-8"></p>
        
        <div class="grid grid-cols-2 gap-4 w-full max-w-sm mb-10">
            <div class="p-5 bg-slate-50 rounded-2xl">
                <p class="text-[10px] font-bold text-slate-400 uppercase">Đúng</p>
                <p class="text-3xl font-black text-slate-800"><span id="res-correct">0</span>/56</p>
            </div>
            <div class="p-5 bg-slate-50 rounded-2xl">
                <p class="text-[10px] font-bold text-slate-400 uppercase">Tỷ lệ</p>
                <p id="res-percent" class="text-3xl font-black text-blue-600">0%</p>
            </div>
        </div>
        
        <button onclick="location.reload()" class="px-10 py-4 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg">LÀM LẠI (XÁO TRỘN MỚI)</button>
    </div>

    <!-- Footer -->
    <div class="p-4 border-t bg-white flex justify-between items-center px-10">
        <button id="prev-btn" onclick="prevQ()" class="text-xs font-bold text-slate-300 disabled:opacity-0">QUAY LẠI</button>
        <div id="feedback" class="text-xs font-medium italic text-slate-400">Chọn đáp án đúng nhất</div>
        <button id="next-btn" onclick="nextQ()" class="px-6 py-2 bg-blue-600 text-white font-bold rounded-lg opacity-0 pointer-events-none text-xs">TIẾP THEO</button>
    </div>
</div>

        { q: "Chất tinh khiết là:", a: ["Nước muối.", "Nước cất.", "Nước cam.", "Nước khoáng."], c: 1, t: "BÀI 10: HỖN HỢP" },

        { q: "Hòa muối vào cốc nước khuấy đều thu được:", a: ["Huyền phù.", "Nhũ tương.", "Dung dịch muối.", "Chất tinh khiết."], c: 2, t: "BÀI 10: HỖN HỢP" },
        { q: "Thành phần chính của đá vôi là:", a: ["Sắt.", "Đồng.", "Sodium carbonate.", "Calcium carbonate."], c: 3, t: "BÀI 10: HỖN HỢP" },

        { q: "Dụng cụ tốt nhất đo chiều dài quyển sách?", a: ["Thước kẻ.", "Cân.", "Đồng hồ.", "Cốc."], c: 0, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "Cách đặt thước đúng khi đo chiều dài:", a: ["Cách đầu vật.", "Vạch 0 trùng đầu vật.", "Đặt thước nghiêng.", "Nhìn mắt lệch."], c: 1, t: "BÀI 3: ĐO LƯỜNG" },

        { 
            q: "Thứ tự các bước đo khối lượng bằng cân đồng hồ:",

            a: ["(1)-(4)-(3)-(2)", "(3)-(4)-(1)-(2)", "(2)-(1)-(3)-(4)", "(3)-(1)-(4)-(2)"], 
            c: 1, t: "BÀI 3: ĐO LƯỜNG" 
        },
        { q: "Đơn vị nào là đơn vị đo chiều dài?", a: ["Kilôgam.", "Lít.", "Giây.", "Mét."], c: 3, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "Thước 10cm có 10 vạch nhỏ giữa các cm. GHĐ/ĐCNN là:", a: ["10cm, 10mm.", "10cm, 0.1mm.", "10cm, 100mm.", "10cm, 1mm."], c: 3, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "Cách đổi đơn vị ĐÚNG là:", a: ["1 yến = 100kg.", "1 tấn = 10 tạ.", "1kg = 10g.", "1 tấn = 100kg."], c: 1, t: "BÀI 3: ĐO LƯỜNG" },
        { q: "Đơn vị nào đo khối lượng?", a: ["Tuần.", "Tấn.", "Giây.", "Ngày."], c: 1, t: "BÀI 3: ĐO LƯỜNG" },

        { q: "Dụng cụ đo nhiệt độ sôi của nước?", a: ["Đổi màu.", "Nhiệt kế rượu.", "Nhiệt kế y tế.", "Nhiệt kế thủy ngân."], c: 3, t: "BÀI 4: ĐO NHIỆT ĐỘ" },

        { q: "Lực tiếp xúc xuất hiện khi vật gây lực ... vật chịu lực.", a: ["Cách xa.", "Có sự tiếp xúc.", "Nằm gần.", "Không tiếp xúc."], c: 1, t: "BÀI 27: LỰC" },

        { q: "Trường hợp nào xuất hiện lực tiếp xúc?", a: ["Quả táo rơi.", "Tay đẩy xe lăn.", "Nam châm hút sắt.", "Lực điện."], c: 1, t: "BÀI 27: LỰC" },
        { q: "Trường hợp nào xuất hiện lực không tiếp xúc?", a: ["Kéo dây.", "Ma sát.", "Mặt bàn đỡ sách.", "Nam châm hút đinh."], c: 3, t: "BÀI 27: LỰC" }

    let quizData = [];
    let currentQ = 0;
    let scoreCorrect = 0;
    let scoreWrong = 0;
    let selectedAnswers = [];

    // Hàm trộn mảng (Fisher-Yates Shuffle)
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initQuiz() {
        // Sao chép và xáo trộn dữ liệu
        quizData = shuffle([...originalData]);
        selectedAnswers = new Array(quizData.length).fill(null);
        currentQ = 0;
        scoreCorrect = 0;
        scoreWrong = 0;
        showQuestion();
    }

    function showQuestion() {
        const data = quizData[currentQ];
        
        document.getElementById('topic-label').innerText = data.t;
        document.getElementById('progress-text').innerText = `${currentQ + 1} / ${quizData.length}`;
        document.getElementById('progress-bar').style.width = `${((currentQ + 1) / quizData.length) * 100}%`;
        document.getElementById('correct-count').innerText = scoreCorrect;
        document.getElementById('wrong-count').innerText = scoreWrong;
        document.getElementById('question-text').innerText = data.q;
        
        const stepsContainer = document.getElementById('steps-container');
        const stepsList = document.getElementById('steps-list');
        if (data.steps) {
            stepsContainer.classList.remove('hidden');
            stepsList.innerHTML = data.steps.map(s => `<div class="step-item">${s}</div>`).join('');
        } else {
            stepsContainer.classList.add('hidden');
        }

        const optionsList = document.getElementById('options-list');
        optionsList.innerHTML = '';
        data.a.forEach((opt, idx) => {
            const btn = document.createElement('div');
            btn.className = `option-card p-4 rounded-xl font-semibold flex items-center gap-4 bg-white`;
            const label = String.fromCharCode(65 + idx);
            
            btn.innerHTML = `
                <span class="w-7 h-7 flex items-center justify-center bg-slate-100 rounded text-[10px] font-black text-slate-400">${label}</span>
                <span class="flex-1 text-sm">${opt}</span>
            `;
            
            if (selectedAnswers[currentQ] !== null) {
                btn.classList.add('disabled', 'cursor-default');
                if (idx === data.c) btn.classList.add('correct');
                else if (idx === selectedAnswers[currentQ]) btn.classList.add('wrong');
            } else {
                btn.onclick = () => selectOption(idx);
            }
            optionsList.appendChild(btn);
        });

        document.getElementById('prev-btn').disabled = currentQ === 0;
        document.getElementById('prev-btn').classList.toggle('opacity-0', currentQ === 0);

        const nextBtn = document.getElementById('next-btn');
        if (selectedAnswers[currentQ] !== null) {
            nextBtn.classList.remove('opacity-0', 'pointer-events-none');
            nextBtn.innerText = currentQ === quizData.length - 1 ? "KẾT QUẢ" : "TIẾP THEO";
        } else {
            nextBtn.classList.add('opacity-0', 'pointer-events-none');
        }
    }

    function selectOption(idx) {
        selectedAnswers[currentQ] = idx;
        const feedback = document.getElementById('feedback');
        
        if (idx === quizData[currentQ].c) {
            scoreCorrect++;
            feedback.innerText = "Chính xác!";
            feedback.className = "text-xs font-bold text-green-500 italic";
        } else {
            scoreWrong++;
            feedback.innerText = "Sai rồi! Đáp án: " + String.fromCharCode(65 + quizData[currentQ].c);
            feedback.className = "text-xs font-bold text-red-500 italic";
        }
        showQuestion();
    }

    function nextQ() {
        if (currentQ < quizData.length - 1) {
            currentQ++;
            resetFeedback();
            showQuestion();
        } else {
            showFinalResult();
        }
    }

    function prevQ() {
        if (currentQ > 0) {
            currentQ--;
            resetFeedback();
            showQuestion();
        }
    }

    function resetFeedback() {
        const f = document.getElementById('feedback');
        f.innerText = "Chọn đáp án đúng nhất";
        f.className = "text-xs font-medium italic text-slate-400";
    }

    function showFinalResult() {
        document.getElementById('main-view').classList.add('hidden');
        document.getElementById('result-view').classList.remove('hidden');
        
        const pct = Math.round((scoreCorrect / quizData.length) * 100);
        document.getElementById('res-correct').innerText = scoreCorrect;
        document.getElementById('res-percent').innerText = pct + "%";
        
        const rank = document.getElementById('rank-display');
        if (pct >= 90) rank.innerText = "XẾP HẠNG: XUẤT SẮC 👑";
        else if (pct >= 75) rank.innerText = "XẾP HẠNG: GIỎI 🌟";
        else if (pct >= 50) rank.innerText = "XẾP HẠNG: ĐẠT 👍";
        else rank.innerText = "XẾP HẠNG: CẦN CỐ GẮNG 💪";
    }

    window.onload = initQuiz;
</script>
</body>
</html>
